---
name: Test LaTeX Release Action

'on':
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    container: ghcr.io/smkwlab/texlive-ja-textlint:2026e@sha256:e2d935e5042b599b5359121459ecf232540a982b13d56429e4da2b663dffc550
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test LaTeX build
        uses: ./
        with:
          files: "test/sample"
          latex_options: "-pdf -interaction=nonstopmode"
          skip_release: "true"
